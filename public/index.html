<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2a66" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/New-DawnLogo.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/New-DawnLogo.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/New-DawnLogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/New-DawnLogo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- SEO Meta Tags -->
    <meta
      name="title"
      content="The New Dawn – Leadership in Action, A State in Motion"
    />
    <meta
      name="description"
      content="The New Dawn is a strategic multimedia programme for public engagement and enlightenment dedicated to the good people of Niger State, documenting governance, leadership, development progress, public engagement, and archives."
    />
    <meta
      name="keywords"
      content="The New Dawn, Niger State, Farmer Governor Mohammed Umaru Bago, Shevet-city Communications, public engagement, documentary, leadership, development, archives, governance in motion"
    />
    <meta name="author" content="Shevet-city Communications" />

    <!-- Open Graph Meta - WhatsApp, Facebook, LinkedIn -->
    <meta property="og:site_name" content="The New Dawn" />
    <meta
      property="og:title"
      content="The New Dawn – Leadership in Action, A State in Motion"
    />
    <meta
      property="og:description"
      content="A strategic multimedia platform capturing governance in motion and documenting Niger State’s development journey through storytelling, documentary, public engagement, and archives."
    />
    <meta property="og:url" content="https://nigerstate-newdawn.com/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://nigerstate-newdawn.com/images/new-dawn-og.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://nigerstate-newdawn.com/images/new-dawn-og.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The New Dawn - Leadership in Action, A State in Motion"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="The New Dawn – Leadership in Action, A State in Motion"
    />
    <meta
      name="twitter:description"
      content="Explore The New Dawn: documentary storytelling, public engagement, leadership archives, records, videos, and Niger State development updates."
    />
    <meta
      name="twitter:image"
      content="https://nigerstate-newdawn.com/images/new-dawn-og.png"
    />

    <title>The New Dawn</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
